<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipeline Panic</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-container">
    <section class="hero">
      <h1>Pipeline Panic</h1>
      <p>Fix broken pipes, collect clean water, and help a village reach its water goal.</p>
    </section>

    <section class="controls">
      <label for="difficulty">Choose difficulty:</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="normal" selected>Normal</option>
        <option value="hard">Hard</option>
      </select>

      <button id="startBtn">Start Game</button>
      <button id="resetBtn">Reset</button>
    </section>

    <section class="stats">
      <p>Score: <span id="score">0</span></p>
      <p>Goal: <span id="goal">15</span></p>
      <p>Time: <span id="time">30</span>s</p>
    </section>

    <p id="message">Pick a difficulty and start fixing pipes!</p>
    <p id="milestone"></p>

    <section id="gameArea" class="game-area"></section>
  </main>

  <footer>
    <p>Inspired by charity: water’s mission to bring clean and safe water to communities.</p>
    <a href="https://www.charitywater.org/" target="_blank">Visit charity: water</a>
    <a href="https://www.charitywater.org/donate" target="_blank">Donate</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
