<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipeline Panic</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <h1>Pipeline Panic</h1>
    <p class="mission">Repair the pipeline and help deliver clean water!</p>

    <section class="stats">
      <p>Score: <span id="score">0</span></p>
      <p>Time: <span id="timer">30</span>s</p>
    </section>

    <p id="message">Click leaks to repair them. Avoid dirty water!</p>

    <section id="board" class="board"></section>

    <button id="resetBtn">Reset Game</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
